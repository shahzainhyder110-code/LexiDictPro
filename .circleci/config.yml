version: 2.1

jobs:
  build:
    docker:
      - image: cimg/android:2024.01
    steps:
      - checkout
      - run:
          name: Extract ZIP
          command: |
            unzip LexiDictPro.zip
            cp -r LexiDictPro/. .
      - run:
          name: Build APK
          command: |
            chmod +x gradlew
            ./gradlew assembleDebug
      - store_artifacts:
          path: app/build/outputs/apk/debug/app-debug.apk

workflows:
  build-apk:
    jobs:
      - build
