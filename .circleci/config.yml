version: 2.1

jobs:
  build:
    docker:
      - image: cimg/android:2024.01
    steps:
      - checkout
      - run:
          name: Extract ZIP
          command: |
            unzip LexiDictPro.zip
            cp -r LexiDictPro/. .
      - run:
          name: Fix Gradle Wrapper
          command: |
            mkdir -p gradle/wrapper
            curl -sL "https://raw.githubusercontent.com/gradle/gradle/v8.6.0/gradle/wrapper/gradle-wrapper.jar" -o gradle/wrapper/gradle-wrapper.jar
      - run:
          name: Build APK
          command: |
            chmod +x gradlew
            ./gradlew assembleDebug
      - store_artifacts:
          path: app/build/outputs/apk/debug/app-debug.apk

workflows:
  build-apk:
    jobs:
      - build
